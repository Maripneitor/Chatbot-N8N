services:
  # Base de Datos Relacional PostgreSQL
  postgres:
    image: postgres:16
    container_name: biblioteca-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-n8n}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-n8n_password}
      POSTGRES_DB: ${DB_NAME:-n8n}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - biblioteca-net

  # Backend REST API en Node.js
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca-api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-n8n}
      DB_PASSWORD: ${DB_PASSWORD:-n8n_password}
      DB_NAME: ${DB_NAME:-n8n}
      N8N_SECRET_TOKEN: ${N8N_SECRET_TOKEN:-clave_secreta_compartida_n8n_node}
      N8N_RFID_WEBHOOK_URL: http://n8n:5678/webhook/alerta-rfid
    depends_on:
      - postgres
    networks:
      - biblioteca-net

  # Orquestador de Flujos e Inteligencia Artificial n8n
  n8n:
    image: n8nio/n8n:latest
    container_name: biblioteca-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-n8n_password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-clave_secreta_local}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
    depends_on:
      - postgres
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - biblioteca-net

volumes:
  postgres_data:
  n8n_data:

networks:
  biblioteca-net:
    driver: bridge
